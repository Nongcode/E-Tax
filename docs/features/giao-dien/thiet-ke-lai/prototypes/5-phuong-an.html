<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>E-Tax — 5 phương án giao diện</title>
<style>
/* Font Segoe UI: font mặc định Windows, WinForms dùng trực tiếp được */
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",system-ui,sans-serif;background:#e9edf2;color:#0f172a;font-size:13px}
.picker{position:sticky;top:0;z-index:10;background:#0f172a;color:#fff;display:flex;gap:8px;align-items:center;padding:10px 16px;flex-wrap:wrap}
.picker b{margin-right:8px;font-size:14px}
.picker button{font:inherit;border:1px solid #334155;background:#1e293b;color:#cbd5e1;padding:6px 12px;border-radius:4px;cursor:pointer}
.picker button.on{background:#2563eb;border-color:#2563eb;color:#fff}
.picker .sep{width:1px;height:24px;background:#334155;margin:0 6px}
.note{max-width:1280px;margin:14px auto 0;padding:0 16px;color:#334155;line-height:1.5}
.note h2{font-size:16px;margin-bottom:4px}
.stage{max-width:1280px;margin:12px auto 40px;padding:0 16px}
/* Khung cửa sổ Windows */
.win{color:var(--fg);border:1px solid #9aa4b2;box-shadow:0 8px 30px rgba(15,23,42,.18);background:#fff;height:760px;display:flex;flex-direction:column;overflow:hidden}
.titlebar{height:32px;display:flex;align-items:center;padding:0 0 0 12px;font-size:12px;flex:none}
.titlebar .t{flex:1}
.titlebar .wc{display:flex}
.titlebar .wc span{width:46px;height:32px;display:grid;place-items:center}
.client{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
.ic{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{text-align:right;font-variant-numeric:tabular-nums}
.mono{font-variant-numeric:tabular-nums}
.sr{position:absolute;left:-9999px}
.overlay{position:absolute;inset:0;background:rgba(15,23,42,.28);display:flex;z-index:5}
.pop{background:var(--card);border:1px solid var(--border);border-radius:var(--r2);box-shadow:0 12px 32px rgba(15,23,42,.22);display:flex;flex-direction:column}
.pop h3{font-size:14px;padding:14px 16px 10px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.pop .ft{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--border)}
.colrow{display:flex;align-items:center;gap:10px;height:32px;padding:0 12px;border-bottom:1px solid var(--row-line)}
.colrow .grip{color:var(--muted);cursor:grab}
.colrow.drag{background:var(--sel)}
.gear{margin-left:auto;align-self:center;display:flex;align-items:center;gap:6px;color:var(--muted);padding:4px 8px;border-radius:var(--r);cursor:pointer}
.gear:hover{background:var(--sel);color:var(--primary)}

/* ============ Thành phần dùng chung (tùy biến bằng biến CSS) ============ */
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
.input{height:32px;border:1px solid var(--border);border-radius:var(--r);padding:0 10px;font:inherit;color:var(--fg);background:var(--input);display:flex;align-items:center;gap:8px}
.input .ph{color:var(--muted)}
.input.focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--ring)}
.btn{height:32px;border-radius:var(--r);padding:0 12px;font:inherit;font-weight:600;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--card);color:var(--fg);cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.lg{height:40px;font-size:14px;justify-content:center}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:var(--r);overflow:hidden;height:32px}
.seg span{padding:0 12px;display:flex;align-items:center;border-right:1px solid var(--border);color:var(--fg);background:var(--card)}
.seg span:last-child{border-right:0}
.seg span.on{background:var(--primary);color:var(--on-primary);font-weight:600}
.chip{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:10px;font-size:11px;font-weight:600}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.info{background:var(--info-bg);color:var(--info)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);padding:0 12px;background:var(--card)}
.tabs span{padding:8px 12px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:600;white-space:nowrap}
.tabs span.on{color:var(--primary);border-bottom-color:var(--primary)}
.tabs .count{font-weight:400;color:var(--muted);margin-left:4px}
table.grid{width:100%;border-collapse:collapse;font-size:12.5px}
.grid th{position:sticky;top:0;background:var(--th-bg);color:var(--th-fg);font-weight:600;text-align:left;padding:0 10px;height:34px;border-bottom:1px solid var(--border);white-space:nowrap}
.grid td{padding:0 10px;height:var(--row);border-bottom:1px solid var(--row-line);white-space:nowrap;color:var(--fg)}
.grid tr:nth-child(even) td{background:var(--zebra)}
.grid tr.sel td{background:var(--sel)}
.grid .cb{width:32px;text-align:center}
.box{width:14px;height:14px;border:1px solid var(--border);border-radius:3px;display:inline-block;vertical-align:middle;background:var(--input)}
.box.on{background:var(--primary);border-color:var(--primary);position:relative}
.box.on:after{content:"";position:absolute;left:4px;top:1px;width:4px;height:8px;border:solid var(--on-primary);border-width:0 2px 2px 0;transform:rotate(45deg)}
.status{height:26px;flex:none;display:flex;align-items:center;gap:16px;padding:0 12px;font-size:12px;border-top:1px solid var(--border);background:var(--status-bg);color:var(--status-fg)}
.status .sp{flex:1}
.status a{color:var(--link);text-decoration:none;font-weight:600}
.kpi{border:1px solid var(--border);border-radius:var(--r2);background:var(--card);padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .k{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:none}
.kpi .v{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--fg)}
.kpi .s{font-size:11.5px;color:var(--muted)}
.radio{display:inline-flex;align-items:center;gap:6px;color:var(--fg);white-space:nowrap}
.radio i{width:14px;height:14px;border-radius:50%;border:1px solid var(--border);display:inline-block;background:var(--input)}
.radio.on i{border:4px solid var(--primary)}
.gridwrap{flex:1;overflow:auto;min-height:0;background:var(--card)}
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.vsep{width:1px;height:20px;background:var(--border)}
.hint{font-size:11.5px;color:var(--muted)}
.captcha{height:48px;flex:1;border:1px solid var(--border);border-radius:var(--r);background:repeating-linear-gradient(45deg,#f1f5f9 0 6px,#e2e8f0 6px 12px);display:grid;place-items:center;font:italic 700 24px Georgia,serif;letter-spacing:6px;color:#334155}
.check{display:flex;align-items:center;gap:8px;color:var(--fg)}
.err{font-size:12px;color:var(--bad);display:flex;gap:6px;align-items:center}

/* ============ Bảng màu từng phương án ============ */
.t1{--primary:#1e3a5f;--on-primary:#fff;--ring:rgba(37,99,235,.25);--fg:#0f172a;--muted:#475569;--border:#d5dbe3;--card:#fff;--input:#fff;--bg:#f4f6f9;--th-bg:#f1f4f8;--th-fg:#1e293b;--row:32px;--row-line:#edf0f4;--zebra:#fafbfc;--sel:#e0ebff;--status-bg:#f1f4f8;--status-fg:#334155;--link:#2563eb;--r:4px;--r2:6px;--ok:#047857;--ok-bg:#d1fae5;--warn:#b45309;--warn-bg:#fef3c7;--bad:#b91c1c;--bad-bg:#fee2e2;--info:#1d4ed8;--info-bg:#dbeafe}
.t2{--primary:#0f766e;--on-primary:#fff;--ring:rgba(15,118,110,.22);--fg:#0f172a;--muted:#52606d;--border:#d9dee5;--card:#fff;--input:#fff;--bg:#f5f7f8;--th-bg:#f8fafb;--th-fg:#334155;--row:32px;--row-line:#eef1f3;--zebra:#fff;--sel:#ccfbf1;--status-bg:#fff;--status-fg:#52606d;--link:#0f766e;--r:6px;--r2:8px;--ok:#047857;--ok-bg:#d1fae5;--warn:#b45309;--warn-bg:#fef3c7;--bad:#b91c1c;--bad-bg:#fee2e2;--info:#0e7490;--info-bg:#cffafe}
.t3{--primary:#185abd;--on-primary:#fff;--ring:rgba(24,90,189,.22);--fg:#1f1f1f;--muted:#5c5c5c;--border:#d1d1d1;--card:#fff;--input:#fff;--bg:#f3f3f3;--th-bg:#f3f3f3;--th-fg:#1f1f1f;--row:28px;--row-line:#e6e6e6;--zebra:#fafafa;--sel:#cfe3ff;--status-bg:#185abd;--status-fg:#fff;--link:#fff;--r:3px;--r2:4px;--ok:#107c10;--ok-bg:#dff6dd;--warn:#8a5a00;--warn-bg:#fff4ce;--bad:#a80000;--bad-bg:#fde7e9;--info:#185abd;--info-bg:#deecf9}
.t4{--primary:#4338ca;--on-primary:#fff;--ring:rgba(67,56,202,.2);--fg:#111827;--muted:#4b5563;--border:#e2e4ea;--card:#fff;--input:#f9fafb;--bg:#f6f7fb;--th-bg:#fff;--th-fg:#4b5563;--row:36px;--row-line:#f0f1f5;--zebra:#fff;--sel:#eef0ff;--status-bg:#fff;--status-fg:#4b5563;--link:#4338ca;--r:6px;--r2:10px;--ok:#047857;--ok-bg:#d1fae5;--warn:#b45309;--warn-bg:#fef3c7;--bad:#b91c1c;--bad-bg:#fee2e2;--info:#4338ca;--info-bg:#e0e7ff}
.t5{--primary:#3b82f6;--on-primary:#fff;--ring:rgba(59,130,246,.35);--fg:#e5e7eb;--muted:#9ca3af;--border:#2e3646;--card:#151b26;--input:#0f141d;--bg:#0b0f16;--th-bg:#1a2130;--th-fg:#cbd5e1;--row:30px;--row-line:#1f2735;--zebra:#131925;--sel:#1e3a8a;--status-bg:#0f141d;--status-fg:#9ca3af;--link:#60a5fa;--r:4px;--r2:6px;--ok:#34d399;--ok-bg:#064e3b;--warn:#fbbf24;--warn-bg:#4a3510;--bad:#f87171;--bad-bg:#4c1414;--info:#93c5fd;--info-bg:#1e3a8a}
.t5 .captcha{background:repeating-linear-gradient(45deg,#1f2735 0 6px,#273043 6px 12px);color:#cbd5e1}
.win.t1 .titlebar{background:#1e3a5f;color:#fff}
.win.t2 .titlebar{background:#fff;color:#334155;border-bottom:1px solid #e5e7eb}
.win.t3 .titlebar{background:#185abd;color:#fff}
.win.t4 .titlebar{background:#fff;color:#4b5563;border-bottom:1px solid #eceef3}
.win.t5 .titlebar{background:#0b0f16;color:#cbd5e1;border-bottom:1px solid #1f2735}
</style>
</head>

};
const ic = (n, s='') => `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true" ${s}>${I[n]}</svg>`;

const rows = [
 ['Bán ra','0322681656','C26TAA','1000','31/10/2026','Công ty TNHH Thương mại An Phát','33.420.000','2.673.600','36.093.600','ok','Đã cấp mã'],

function grid(opts={}) {
  const dir = opts.dir !== false;
  return `<table class="grid"><thead><tr>
    <th class="cb"><span class="box"></span></th><th>STT</th>${dir?'<th>Chiều</th>':''}<th>Ký hiệu</th><th>Số HĐ</th><th>Ngày lập</th>
    <th>MST</th><th>Tên người bán / mua</th>${opts.amounts!==false?'<th class="num">Chưa thuế</th><th class="num">Thuế GTGT</th>':''}<th class="num">Tổng thanh toán</th><th>Trạng thái</th></tr></thead><tbody>
    ${rows.map((r,i)=>`<tr class="${i===1?'sel':''}"><td class="cb"><span class="box ${i===1||i===3?'on':''}"></span></td><td class="mono">${i+1}</td>
    ${dir?`<td>${r[0]}</td>`:''}<td>${r[2]}</td><td class="mono">${r[3]}</td><td class="mono">${r[4]}</td><td class="mono">${r[1]}</td>
    <td style="max-width:${opts.nameW||240}px;overflow:hidden;text-overflow:ellipsis">${r[5]}</td>${opts.amounts!==false?`<td class="num">${r[6]}</td><td class="num">${r[7]}</td>`:''}<td class="num"><b>${r[8]}</b></td>
    <td><span class="chip ${r[9]}">${r[10]}</span></td></tr>`).join('')}
  </tbody></table>`;
}

let cur = 6, screen = 'main';
const opts = document.getElementById('opts');
opts.innerHTML = Object.keys(D).filter(k => [3,6,7].includes(+k)).map(k=>`<button data-opt="${k}">${D[k].name}</button>`).join(' ');
function render(){
  document.querySelectorAll('[data-opt]').forEach(b=>b.classList.toggle('on', +b.dataset.opt===cur));
  document.querySelectorAll('[data-screen]').forEach(b=>b.classList.toggle('on', b.dataset.screen===screen));
  document.getElementById('note').innerHTML = D[cur].note;
  const title = screen==='login' ? 'E-Tax' : 'E-Tax — 0110443702';
  const theme = cur >= 6 ? 3 : cur;
  const base = screen === 'login' ? 'login' : 'main';
  let html = D[cur][base]();
  if (screen === 'filter' || screen === 'columns') {
    const i = html.lastIndexOf('<div class="status">');
    const pop = screen === 'filter' ? filterPopup() : columnPopup();
    html = i > 0 ? html.slice(0, i) + pop + html.slice(i) : html + pop;
  }
  document.getElementById('win').innerHTML = `<div class="win t${theme}">${titlebar(title)}<div style="position:relative;flex:1;display:flex;flex-direction:column;min-height:0">${html}</div></div>`;
}
document.addEventListener('click', e=>{
  const o = e.target.closest('[data-opt]'), s = e.target.closest('[data-screen]');
  if(o){cur=+o.dataset.opt;render();} if(s){screen=s.dataset.screen;render();}
});
const h = new URLSearchParams(location.hash.slice(1) || location.search.slice(1)); if(h.get('o')) cur=+h.get('o'); if(h.get('s')) screen=h.get('s');
render();
